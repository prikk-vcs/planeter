# cargo-deny configuration (RFC 001 gates). The workspace has no external dependencies yet, so these
# checks are trivially clean today; the config is in place so they stay meaningful as deps are added.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. MPL-2.0 is weak (file-level) copyleft: obligations attach to the MPL files
# themselves, not to code that merely depends on them, so it is safe for an Apache-2.0 project to consume
# as a library. It enters via ammonia's CSS sanitizer (`cssparser`, `dtoa-short`) — part of the RFC 003
# T4 rendering-safety stack.
allow = [
    "Apache-2.0",
    "MIT",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "MPL-2.0",
    # Permissive; enters via axum's router (`matchit`, "MIT AND BSD-3-Clause") — part of the RFC 003
    # T3 web stack.
    "BSD-3-Clause",
    # Permissive (OSI). `aws-lc-rs`, `aws-lc-sys` and `untrusted` (jsonwebtoken's `aws_lc_rs` backend, D-50)
    # carry it; `simple_asn1` (dev-only, jsonwebtoken's `use_pem`) too.
    "ISC",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps carry no version (they are `{ path = ... }`); that is not a real wildcard
# risk, so allow it while still denying wildcard *registry* versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
