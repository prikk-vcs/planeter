name: Release

# The release cycle (ROADMAP §Release cycles): planeter releases an APPLICATION, never crates — a bare
# version tag → every gate green → per-target server binaries + a container image → build-provenance
# attestations → a GitHub release. Tagging is owner-only; this workflow only runs after that act.
#
# Targets: Linux x86_64 + aarch64 only. planeter's sandbox is bubblewrap (RFC 001 T4), which is
# Linux-only, so a macOS/Windows asset would be a platform claim resting on nothing (the lesson of
# prikk's RFC 107). Per-target steps are written out in full, as prikk's workflow does, so a reader can
# verify each by exact match rather than trusting a template.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # A DISPATCH never releases (RFC 010 D-10): a release is made only by a tag push, and a dispatch is
  # refused unless it runs from `main`. It has two modes:
  #
  # * `dry-run` (the default): the gates, both builds, `build-info.txt` and a no-push image build. It
  #   publishes nothing at all: no registry login, no push, no attestation, no GitHub release.
  # * `rehearsal`: the same, and then what a dry run cannot exercise — login to ghcr, push and attestation —
  #   but ONLY to the throwaway package `ghcr.io/prikk-vcs/planeter-rehearsal:rehearsal` (one tag,
  #   overwritten each run) and, for the tarballs, attestations of copies named `rehearsal-<name>`. It
  #   never creates a GitHub release or a tag, never writes `ghcr.io/prikk-vcs/planeter` (any tag), never
  #   runs the `publish` job and never touches crates.io. `planeter-pin-check` fails if a step could break
  #   any of that. The footprint is accepted (O-5): one private package and permanent, labelled
  #   attestation records.
  #
  # The workflow never touches crates.io in any mode.
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: publish nothing at all · rehearsal: push and attest to the throwaway rehearsal package only"
        type: choice
        options:
          - dry-run
          - rehearsal
        default: dry-run

permissions:
  contents: read

env:
  # What the retired toolchain action used to set for every job.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The prikk release baked into the container image (dependency-ledger PK-26). Bump with the pin.
  PRIKK_VERSION: "0.54.0"

jobs:
  gates:
    name: gates (tag == Cargo version · floor · pins · fmt · clippy · test · deny · audit · ENF-2 · layering)
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a dispatch that is not on main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "A dispatch (dry-run or rehearsal) runs from main only; a release is made only by pushing a version tag." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version
      - name: Tag must equal the workspace version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: grep -qx "version = \"$TAG\"" Cargo.toml || { echo "Cargo.toml [workspace.package] version != tag $TAG"; exit 1; }
      - name: Floor check (RFC 010 D-2)
        run: cargo run --locked -p planeter-floor-check
      - name: Pin check (RFC 010 D-5)
        run: cargo run --locked -p planeter-pin-check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (includes the layering gate)
        run: cargo test --workspace --locked
      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked
      - name: cargo-deny
        run: cargo deny check
      - name: cargo-audit
        run: cargo audit
      - name: ENF-2 symbol-absence check (keyless forge)
        run: tools/enf2-symbol-check/check.sh

  build:
    name: build (${{ matrix.target }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Build (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          # Compile-time identity (RFC 010 D-6): `planeter --version` reports this commit.
          PLANETER_GIT_COMMIT: ${{ github.sha }}
        run: cargo build -p planeter --release --target x86_64-unknown-linux-gnu --locked
      - name: Build (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          # Compile-time identity (RFC 010 D-6): `planeter --version` reports this commit.
          PLANETER_GIT_COMMIT: ${{ github.sha }}
        run: cargo build -p planeter --release --target aarch64-unknown-linux-gnu --locked

      - name: Package (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-gnu/release/planeter stage/planeter
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/planeter-x86_64-unknown-linux-gnu.tar.gz planeter LICENSE
          ( cd dist && sha256sum planeter-x86_64-unknown-linux-gnu.tar.gz > planeter-x86_64-unknown-linux-gnu.tar.gz.sha256 )
          echo "target: x86_64-unknown-linux-gnu" > dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
          echo "build: cargo build -p planeter --release --target x86_64-unknown-linux-gnu --locked" >> dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
          echo "requires: prikk >= ${PRIKK_VERSION}, bubblewrap, prlimit (util-linux), curl (SSO only)" >> dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
          # The binary's own identity (version, commit, prikk floor): the same three lines as `--version`.
          target/x86_64-unknown-linux-gnu/release/planeter --version >> dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
          rustc -vV >> dist/planeter-x86_64-unknown-linux-gnu.build-info.txt
      - name: Package (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p stage dist
          cp target/aarch64-unknown-linux-gnu/release/planeter stage/planeter
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/planeter-aarch64-unknown-linux-gnu.tar.gz planeter LICENSE
          ( cd dist && sha256sum planeter-aarch64-unknown-linux-gnu.tar.gz > planeter-aarch64-unknown-linux-gnu.tar.gz.sha256 )
          echo "target: aarch64-unknown-linux-gnu" > dist/planeter-aarch64-unknown-linux-gnu.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/planeter-aarch64-unknown-linux-gnu.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/planeter-aarch64-unknown-linux-gnu.build-info.txt
          echo "build: cargo build -p planeter --release --target aarch64-unknown-linux-gnu --locked" >> dist/planeter-aarch64-unknown-linux-gnu.build-info.txt
          echo "requires: prikk >= ${PRIKK_VERSION}, bubblewrap, prlimit (util-linux), curl (SSO only)" >> dist/planeter-aarch64-unknown-linux-gnu.build-info.txt
          # The binary's own identity (version, commit, prikk floor): the same three lines as `--version`.
          target/aarch64-unknown-linux-gnu/release/planeter --version >> dist/planeter-aarch64-unknown-linux-gnu.build-info.txt
          rustc -vV >> dist/planeter-aarch64-unknown-linux-gnu.build-info.txt

      # Build provenance (SLSA-style) for the tarball, signed by GitHub's OIDC identity of this run.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # REHEARSAL ONLY (RFC 010 D-10): attest byte-identical COPIES named `rehearsal-<name>`, so the
      # permanent attestation records are labelled and cannot be mistaken for a release's. The copies are
      # outside `dist/`, so they are neither uploaded nor published.
      - name: Copy tarballs for the rehearsal attestation
        if: inputs.mode == 'rehearsal'
        run: |
          mkdir -p rehearsal
          for f in dist/*.tar.gz; do cp "$f" "rehearsal/rehearsal-$(basename "$f")"; done
          ls -l rehearsal
      - name: Attest rehearsal build provenance
        if: inputs.mode == 'rehearsal'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: rehearsal/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planeter-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The container image (RFC 010 D-11): each architecture is built NATIVELY on its own runner (no QEMU, no
  # `docker/*` action) by a `docker-container` buildx builder whose BuildKit image is pinned by digest
  # (moby/buildkit v0.33.1, the build `docker/setup-buildx-action` pulled as `buildx-stable-1` before this
  # change). Each architecture is pushed BY DIGEST, with BuildKit's provenance (`mode=max`, as before), and a
  # later job joins the two into one manifest list with `docker buildx imagetools create`, tags it, and
  # attests the manifest list's digest. No per-architecture tag is ever written to a package.
  #
  # Which package a step writes is decided by its own `if`, and `planeter-pin-check` enforces it: the steps
  # that name `ghcr.io/prikk-vcs/planeter` run on a tag push only; the steps that name the rehearsal package
  # run in a rehearsal only; a dry run builds without a push. The registry login pipes the job token on
  # standard input.
  image:
    name: image (${{ matrix.arch }}, native)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only this architecture's planeter build artifact (the prebuilt, attested binary; the image never compiles).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planeter-${{ matrix.target }}
          path: dist
      - name: Stage the binary for the Dockerfile
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "ctx/${ARCH}"
          tar -xzf "dist/planeter-${TARGET}.tar.gz" -C "ctx/${ARCH}" planeter
      - name: BuildKit builder (docker-container; image pinned by digest, D-9 record in the review request)
        run: |
          set -euo pipefail
          docker buildx create --name planeter-builder --driver docker-container --driver-opt image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea --use
          docker buildx inspect --bootstrap planeter-builder
      # THE GATE (D-51, in every mode, before anything is pushed or attested): the image this job just built is RUN, and the
      # binary's glibc needs are checked against the glibc of the image that carries it. A binary the image's loader refuses to
      # start (built on a newer runner than the base image) fails here, never in a user's hands. `planeter-pin-check` refuses a
      # workflow in which a push or an attestation is not preceded by both steps.
      - name: Build the image for this architecture and load it (every mode)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build --builder planeter-builder --platform "linux/${ARCH}" --file Dockerfile \
            --build-arg "PRIKK_VERSION=${PRIKK_VERSION}" --load --iidfile image-id.txt .
          grep -Eqx 'sha256:[0-9a-f]{64}' image-id.txt
          cat image-id.txt
      - name: Run the image - planeter and prikk start (every mode)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat image-id.txt)"
          printf '%s\n' "${IMAGE_ID}" | grep -Eqx 'sha256:[0-9a-f]{64}'
          docker run --rm --platform "linux/${ARCH}" "${IMAGE_ID}" --version | tee planeter-version.txt
          grep -Eq '^planeter [0-9]+\.[0-9]+\.[0-9]+' planeter-version.txt
          docker run --rm --platform "linux/${ARCH}" --entrypoint prikk "${IMAGE_ID}" --version
          docker run --rm --platform "linux/${ARCH}" --entrypoint bwrap "${IMAGE_ID}" --version
          docker run --rm --platform "linux/${ARCH}" --entrypoint prlimit "${IMAGE_ID}" --version
      - name: Rust toolchain for the glibc check (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version
      - name: Check the binary's glibc needs against the image's glibc (every mode)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat image-id.txt)"
          printf '%s\n' "${IMAGE_ID}" | grep -Eqx 'sha256:[0-9a-f]{64}'
          base="$(docker run --rm --platform "linux/${ARCH}" --entrypoint ldd "${IMAGE_ID}" --version | head -n 1)"
          echo "the image's ldd says: ${base}"
          cargo run --locked --release -p planeter-glibc-check -- "ctx/${ARCH}/planeter" "${base}"
      # The real publish: only a tag push.
      - name: Log in to ghcr
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push by digest
        if: github.event_name == 'push'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build --builder planeter-builder --platform "linux/${ARCH}" --file Dockerfile \
            --build-arg "PRIKK_VERSION=${PRIKK_VERSION}" \
            --provenance "mode=max,builder-id=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --output "type=image,name=ghcr.io/prikk-vcs/planeter,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          mkdir -p digest
          jq -er '."containerimage.digest"' meta.json > "digest/${ARCH}"
          grep -Eqx 'sha256:[0-9a-f]{64}' "digest/${ARCH}"
          cat "digest/${ARCH}"
      - name: The pushed image is the image that was run
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tested="$(cat image-id.txt)"
          pushed="$(jq -er '."containerimage.config.digest"' meta.json)"
          echo "run: ${tested}  pushed config: ${pushed}"
          test "${tested}" = "${pushed}"
      # REHEARSAL ONLY (RFC 010 D-10): the same, to the throwaway package.
      - name: Log in to ghcr (rehearsal)
        if: inputs.mode == 'rehearsal'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push by digest (rehearsal)
        if: inputs.mode == 'rehearsal'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build --builder planeter-builder --platform "linux/${ARCH}" --file Dockerfile \
            --build-arg "PRIKK_VERSION=${PRIKK_VERSION}" \
            --provenance "mode=max,builder-id=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --output "type=image,name=ghcr.io/prikk-vcs/planeter-rehearsal,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          mkdir -p digest
          jq -er '."containerimage.digest"' meta.json > "digest/${ARCH}"
          grep -Eqx 'sha256:[0-9a-f]{64}' "digest/${ARCH}"
          cat "digest/${ARCH}"
      - name: The pushed image is the image that was run
        if: inputs.mode == 'rehearsal'
        run: |
          set -euo pipefail
          tested="$(cat image-id.txt)"
          pushed="$(jq -er '."containerimage.config.digest"' meta.json)"
          echo "run: ${tested}  pushed config: ${pushed}"
          test "${tested}" = "${pushed}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: digest/*
          if-no-files-found: ignore

  # The real manifest list: only a tag push. Joins the two architectures' digests, tags `<tag>` and `latest`,
  # and attests the manifest list.
  image-publish:
    name: image manifest list + attestation (ghcr.io/prikk-vcs/planeter)
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: digest
          merge-multiple: true
      - name: Log in to ghcr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Join the architectures into one manifest list
        id: manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          amd64="$(cat digest/amd64)"; arm64="$(cat digest/arm64)"
          printf '%s\n%s\n' "$amd64" "$arm64" | grep -Ecx 'sha256:[0-9a-f]{64}' | grep -qx 2
          docker buildx imagetools create \
            --tag "ghcr.io/prikk-vcs/planeter:${TAG}" --tag ghcr.io/prikk-vcs/planeter:latest \
            "ghcr.io/prikk-vcs/planeter@${amd64}" "ghcr.io/prikk-vcs/planeter@${arm64}"
          docker buildx imagetools inspect "ghcr.io/prikk-vcs/planeter:${TAG}"
          list="$(docker buildx imagetools inspect "ghcr.io/prikk-vcs/planeter:${TAG}" --format '{{json .Manifest}}' | jq -er .digest)"
          printf '%s\n' "$list" | grep -Eqx 'sha256:[0-9a-f]{64}'
          echo "digest=${list}" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/prikk-vcs/planeter
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # REHEARSAL ONLY (RFC 010 D-10): the same, to the throwaway package; one tag, overwritten each run.
  image-rehearsal:
    name: image manifest list + attestation (rehearsal package)
    if: inputs.mode == 'rehearsal'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: digest
          merge-multiple: true
      - name: Log in to ghcr (rehearsal)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Join the architectures into one manifest list (rehearsal)
        id: manifest
        run: |
          set -euo pipefail
          amd64="$(cat digest/amd64)"; arm64="$(cat digest/arm64)"
          printf '%s\n%s\n' "$amd64" "$arm64" | grep -Ecx 'sha256:[0-9a-f]{64}' | grep -qx 2
          docker buildx imagetools create \
            --tag ghcr.io/prikk-vcs/planeter-rehearsal:rehearsal \
            "ghcr.io/prikk-vcs/planeter-rehearsal@${amd64}" "ghcr.io/prikk-vcs/planeter-rehearsal@${arm64}"
          docker buildx imagetools inspect ghcr.io/prikk-vcs/planeter-rehearsal:rehearsal
          list="$(docker buildx imagetools inspect ghcr.io/prikk-vcs/planeter-rehearsal:rehearsal --format '{{json .Manifest}}' | jq -er .digest)"
          printf '%s\n' "$list" | grep -Eqx 'sha256:[0-9a-f]{64}'
          echo "digest=${list}" >> "$GITHUB_OUTPUT"
      - name: Attest rehearsal image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/prikk-vcs/planeter-rehearsal
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  publish:
    name: publish release assets
    if: github.event_name == 'push'
    needs: [build, image-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the planeter build artifacts (a name filter keeps any other artifact, such as a BuildKit build
      # record, out of the release; an unfiltered download of one failed the first 0.1.0 publish attempt).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: planeter-*
          path: dist
          merge-multiple: true
      # Notes = this tag's CHANGELOG section (kept honest by hand, per release) + runtime prerequisites.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
          printf '\n---\n**Runtime prerequisites:** prikk >= %s, bubblewrap, prlimit (util-linux) and (for SSO) curl on the host — or use the container image `ghcr.io/prikk-vcs/planeter:%s`, which bundles all three.\n' "$PRIKK_VERSION" "$TAG" >> release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.build-info.txt --repo prikk-vcs/planeter --title "$TAG" --notes-file release-notes.md
