name: Supply chain (manual checkpoint)

# RFC 010 D-3: the supply-chain gate runs at project events (a push, a release, a re-baseline, an RFC
# disposition, an out-of-band report), not on a clock. This workflow exists so that a checkpoint can
# leave a durable CI record. It is manual only: no `schedule`, no secrets, read-only token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch head, 2026-10-15; toolchain pinned by input
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      # Both tools fetch the RustSec advisory database when they run, so a result reflects advisories
      # published since the last code change.
      - name: cargo-deny (freshly fetched advisory database)
        run: cargo deny check

      - name: cargo-audit (freshly fetched advisory database)
        run: cargo audit
