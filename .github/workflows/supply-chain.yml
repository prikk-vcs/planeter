name: Supply chain (manual checkpoint)

# RFC 010 D-3: the supply-chain gate runs at project events (a push, a release, a re-baseline, an RFC
# disposition, an out-of-band report), not on a clock. This workflow exists so that a checkpoint can
# leave a durable CI record. It is manual only: no `schedule`, no secrets, read-only token.

on:
  workflow_dispatch:

permissions:
  contents: read

# What the retired toolchain action used to set for every job: no incremental builds on a one-shot runner,
# coloured cargo output in the logs.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.1
          rustc --version
          cargo --version

      - name: Install cargo-deny and cargo-audit (pinned)
        # IS-58 (2026-11-14): the gate tools are pinned, the versions that produced the green runs of 0.6.0 (CI 43585198476, the
        # rehearsal 43575291310 and the release 43579591208 all built cargo-deny 0.20.2 and cargo-audit 0.23.0). Moved at the pins
        # review of each release (docs/RELEASING.md, step 5); planeter-pin-check requires the exact version, `--locked`, and the same
        # version in the three workflows.
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.23.0 --locked

      # Both tools fetch the RustSec advisory database when they run, so a result reflects advisories
      # published since the last code change.
      - name: cargo-deny (freshly fetched advisory database)
        run: cargo deny check

      - name: cargo-audit (freshly fetched advisory database)
        run: cargo audit
