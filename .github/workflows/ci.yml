name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# What the retired toolchain action used to set for every job: no incremental builds on a one-shot runner,
# coloured cargo output in the logs.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (includes the layering gate)
        run: cargo test --workspace --locked

  msrv:
    # IS-32 (RFC 010 D-5): the declared minimum compiler is built with, so the claim cannot be false.
    # This job's toolchain must equal `rust-version` in Cargo.toml (pin-check enforces it); it is the one
    # named exception to "one compiler for CI and release".
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (the declared minimum, not the pinned build compiler)
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Check the workspace at the declared minimum
        run: cargo check --workspace --locked

  enf2:
    # ENF-2 (RFC 001 §0a / INV-2): the keyless forge ships no history-signing symbol by default.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: ENF-2 symbol-absence check
        run: tools/enf2-symbol-check/check.sh

  # RFC 010 D-2 / D-5: the three prikk floors agree; nothing in the build chain is mutable.
  maintenance-gates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Floor check (cli.rs, release.yml, Dockerfile agree)
        run: cargo run --locked -p planeter-floor-check

      - name: Pin check (actions, base image, toolchain)
        run: cargo run --locked -p planeter-pin-check

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit
