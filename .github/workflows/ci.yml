name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (includes the layering gate)
        run: cargo test --workspace --locked

  enf2:
    # ENF-2 (RFC 001 §0a / INV-2): the keyless forge ships no history-signing symbol by default.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: ENF-2 symbol-absence check
        run: tools/enf2-symbol-check/check.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit
