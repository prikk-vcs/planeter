name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# What the retired toolchain action used to set for every job: no incremental builds on a one-shot runner,
# coloured cargo output in the logs.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The prikk release the `client` job installs to run the client's commands on every system (RFC 004 part 10 T3): the floor, so that the
  # commands are tested against the oldest prikk planeter promises to work with. `planeter-floor-check` keeps it equal to the other floors.
  PRIKK_VERSION: "0.54.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (includes the layering gate)
        run: cargo test --workspace --locked

  msrv:
    # IS-32 (RFC 010 D-5): the declared minimum compiler is built with, so the claim cannot be false.
    # This job's toolchain must equal `rust-version` in Cargo.toml (pin-check enforces it); it is the one
    # named exception to "one compiler for CI and release".
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (the declared minimum, not the pinned build compiler)
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Check the workspace at the declared minimum
        run: cargo check --workspace --locked

  enf2:
    # ENF-2 (RFC 001 §0a / INV-2): the keyless forge ships no history-signing symbol by default.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: ENF-2 symbol-absence check
        run: tools/enf2-symbol-check/check.sh

  # RFC 010 D-2 / D-5: the three prikk floors agree; nothing in the build chain is mutable.
  maintenance-gates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Floor check (cli.rs, release.yml, Dockerfile agree)
        run: cargo run --locked -p planeter-floor-check

      - name: Pin check (actions, base image, toolchain)
        run: cargo run --locked -p planeter-pin-check

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit

  # RFC 004 part 9, T0 (D-50): the client helper's dependency set (ureq + rustls with aws-lc-rs + webpki-roots) builds, and its tests run,
  # on the three systems a person may use. The server is Linux only; this crate is not. Runner labels are pinned (no `-latest`).
  # The native tools the build found are printed so the build requirements per system are measured, not assumed.
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned, one compiler for CI and release)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version

      # prikk publishes release assets for Linux, macOS (arm64) and Windows (x86_64): the client's commands are tested with the real thing.
      # Pinned by version, checksum-verified against the release's own `.sha256` before extraction, as the Dockerfile does.
      - name: Install prikk (the floor, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) T=x86_64-unknown-linux-gnu; EXT=tar.gz ;;
            macOS) T=aarch64-apple-darwin; EXT=tar.gz ;;
            Windows) T=x86_64-pc-windows-msvc; EXT=zip ;;
          esac
          mkdir -p "$RUNNER_TEMP/prikk-dl" "$RUNNER_TEMP/prikk-bin"
          cd "$RUNNER_TEMP/prikk-dl"
          curl -fsSLO "https://github.com/prikk-vcs/prikk/releases/download/${PRIKK_VERSION}/prikk-${T}.${EXT}"
          curl -fsSLO "https://github.com/prikk-vcs/prikk/releases/download/${PRIKK_VERSION}/prikk-${T}.${EXT}.sha256"
          cat "prikk-${T}.${EXT}.sha256"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c "prikk-${T}.${EXT}.sha256"; else shasum -a 256 -c "prikk-${T}.${EXT}.sha256"; fi
          if [ "$EXT" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -Path 'prikk-${T}.zip' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/prikk-bin")'"
          else
            tar -xzf "prikk-${T}.${EXT}" -C "$RUNNER_TEMP/prikk-bin"
          fi
          ls -l "$RUNNER_TEMP/prikk-bin"
          echo "$RUNNER_TEMP/prikk-bin" >> "$GITHUB_PATH"
      - name: prikk runs here
        shell: bash
        run: prikk --version

      - name: Native tools present on this runner
        shell: bash
        run: |
          for t in cc gcc clang cmake nasm perl go ninja make; do
            if command -v "$t" >/dev/null 2>&1; then echo "$t: $("$t" --version 2>&1 | head -n 1)"; else echo "$t: absent"; fi
          done

      - name: Build planeter-client (release, locked), with its time and size
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo build -p planeter-client --release --locked
          end=$(date +%s)
          echo "clean release build: $((end - start)) s"
          ls -l target/release/planeter-client*

      # A measurement, not a gate (continue-on-error): what does the build need? The same build with nasm and cmake made unusable.
      # On Windows the directories that hold nasm.exe or cmake.exe are taken off PATH; elsewhere (where they live in /usr/bin beside
      # the compiler) a stub that fails is put in front of them.
      - name: Measure the native build requirements (build again with nasm and cmake unusable)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            clean=""
            IFS=':' read -ra dirs <<< "$PATH"
            for d in "${dirs[@]}"; do
              if [ -e "$d/nasm.exe" ] || [ -e "$d/cmake.exe" ]; then echo "taken off PATH: $d"; else clean="$clean:$d"; fi
            done
            export PATH="${clean#:}"
          else
            mkdir -p "$RUNNER_TEMP/shims"
            for t in nasm cmake; do printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/shims/$t"; chmod +x "$RUNNER_TEMP/shims/$t"; done
            export PATH="$RUNNER_TEMP/shims:$PATH"
          fi
          for t in nasm cmake; do if command -v "$t" >/dev/null 2>&1 && "$t" --version >/dev/null 2>&1; then echo "$t still works"; else echo "$t does not work now"; fi; done
          CARGO_TARGET_DIR=target-without-nasm-cmake cargo build -p planeter-client --release --locked
          echo "build without nasm and cmake: exit=$?"

      - name: Test planeter-client
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo test -p planeter-client --locked
          end=$(date +%s)
          echo "build and test of the test profile: $((end - start)) s"
