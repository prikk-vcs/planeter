[package]
name = "planeter-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "planeter's persistence: repository/identity records, roles and membership, behind swappable store traits (in-memory, SQLite)."

[dependencies]
# M1 pre-tag item 2: the persistent backend behind the *Store traits. Bundled SQLite (compiled from the
# vendored amalgamation; public-domain SQLite, MIT bindings) so a deployment needs no system library.
rusqlite = { version = "0.32", features = ["bundled"] }
