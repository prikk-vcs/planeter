[package]
name = "planeter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "planeter's forge domain: hosting, the single pure default-deny authorize() decision, the honest read path, and the security seams."

[features]
# Reserved, OFF BY DEFAULT (RFC 001 §0a / LAY-4 / ENF-2): the seam under which any history-signing
# ("forge-seal") code would live. planeter is a keyless forge (INV-2) — no seal code exists yet, and the
# ENF-2 CI check proves the forge-signer symbol is absent from the default build.
forge-seal = []

[dependencies]
planeter-prikk = { path = "../planeter-prikk", version = "0.1.0" }
planeter-store = { path = "../planeter-store", version = "0.1.0" }
# Read-path view-models derive Serialize so the web/API surface (RFC 003 T3) can emit them as JSON.
serde = { version = "1", features = ["derive"] }
# The egress guard (T-8/C-8) parses outbound URLs; `url` is already in the tree via ammonia.
url = "2"

[dev-dependencies]
# Test-only: build prikk model fixtures from JSON to exercise the read-path view converters.
serde_json = "1"
