[package]
name = "planeter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "The planeter forge server: hosts and serves prikk repositories over a sandboxed prikk, with a keyless, default-deny, honest read path."

[dependencies]
planeter-core = { path = "../planeter-core", version = "0.8.0" }
planeter-auth = { path = "../planeter-auth", version = "0.8.0" }
planeter-store = { path = "../planeter-store", version = "0.8.0" }
planeter-web = { path = "../planeter-web", version = "0.8.0" }
planeter-prikk = { path = "../planeter-prikk", version = "0.8.0" }
planeter-transport = { path = "../planeter-transport", version = "0.8.0" }
planeter-ci = { path = "../planeter-ci", version = "0.8.0" }
planeter-registry = { path = "../planeter-registry", version = "0.8.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
# Test-only (the real-server delivery tests read JSON replies and share the engine tests' fixtures): already in the lock through the
# web and prikk crates; nothing new enters `Cargo.lock`.
serde_json = "1"
