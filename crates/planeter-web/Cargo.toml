[package]
name = "planeter-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "planeter's HTTP surface: the GET read API with strict sanitization, CSP and an isolated content origin."

[dependencies]
planeter-core = { path = "../planeter-core", version = "0.1.1" }
planeter-auth = { path = "../planeter-auth", version = "0.1.1" }
planeter-store = { path = "../planeter-store", version = "0.1.1" }

# T4 rendering safety (RFC 003 / STD-6): strict HTML sanitization + a pure-Rust Markdown renderer.
ammonia = "4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# T3 HTTP/API surface (RFC 003 / STD-3): the standard async web stack (owner-approved).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio"] }
# Browse UI templates (compile-time, auto-escaping). Measured 2026-09-23: +6 crates, deny/audit clean.
askama = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test-only: drive the axum Router directly (no live socket) via ServiceExt::oneshot.
tower = { version = "0.5", features = ["util"] }
planeter-prikk = { path = "../planeter-prikk", version = "0.1.1" }
