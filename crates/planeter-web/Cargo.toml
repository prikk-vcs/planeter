[package]
name = "planeter-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "HTTP server, REST API, web UI, webhooks (RFC 003+)."
publish = false

[dependencies]
planeter-core = { path = "../planeter-core" }
planeter-auth = { path = "../planeter-auth" }
planeter-store = { path = "../planeter-store" }

# T4 rendering safety (RFC 003 / STD-6): strict HTML sanitization + a pure-Rust Markdown renderer.
ammonia = "4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
