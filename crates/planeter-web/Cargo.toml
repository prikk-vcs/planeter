[package]
name = "planeter-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "planeter's HTTP surface: the browse UI and GET read API, sign-in (local or OIDC) with sessions and CSRF, strict sanitization, CSP, trusted-proxy client IPs and an isolated content origin."

[dependencies]
planeter-core = { path = "../planeter-core", version = "0.4.0" }
planeter-auth = { path = "../planeter-auth", version = "0.4.0" }
planeter-store = { path = "../planeter-store", version = "0.4.0" }
planeter-transport = { path = "../planeter-transport", version = "0.4.0" }

# T4 rendering safety (RFC 003 / STD-6): strict HTML sanitization + a pure-Rust Markdown renderer.
ammonia = "4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# T3 HTTP/API surface (RFC 003 / STD-3): the standard async web stack (owner-approved).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio"] }
# Browse UI templates (compile-time, auto-escaping). Measured 2026-09-23: +6 crates, deny/audit clean.
# The default features are trimmed on purpose (IS-42): `config` (askama.toml) pulls `basic-toml`, which carries
# RUSTSEC-2026-0374, and planeter has no `askama.toml`. Re-enable `config` only if an `askama.toml` is needed
# and the advisory is resolved.
askama = { version = "0.13", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
# The spool file is served as a body stream (a `Stream` impl, no allocation of the whole artifact). Already in the lock
# through axum; nothing new enters `Cargo.lock`.
futures-core = "0.3"
serde_json = "1"

[dev-dependencies]
# Test-only: drive the axum Router directly (no live socket) via ServiceExt::oneshot.
tower = { version = "0.5", features = ["util"] }
# Test-only: parse rendered pages for the structural checks (RFC 012 D-5). Already in the lock, through
# `ammonia`; nothing new enters `Cargo.lock`.
html5ever = "0.40"
# Test-only: sign ES256 ID tokens from a PEM fixture for the OIDC flow test.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
planeter-prikk = { path = "../planeter-prikk", version = "0.4.0" }
