<!doctype html>
<html lang="{{ t.lang_tag() }}" dir="{{ t.dir() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t.product() }}{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <a href="/">{{ t.product() }}</a>
  {% block nav %}{% endblock %}
  <span class="who">{% if let Some(u) = user %}{{ u }} · <form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">{{ t.get(Key::LayoutSignOut) }}</button></form>{% else %}<a href="/login">{{ t.get(Key::LayoutSignIn) }}</a>{% endif %}</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
