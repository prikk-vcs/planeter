{% extends "base.html" %}
{% block title %}{{ t.msg(Key::TitleLogin).product() }}{% endblock %}
{% block body %}
<h1>{{ t.get(Key::LoginHeading) }}</h1>
{% if failed %}<p class="badge bad">{{ t.get(Key::LoginFailed) }}</p>{% endif %}
{% if sso %}<p><a href="/login/oidc">{{ t.get(Key::LoginSso) }}</a></p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p><label>{{ t.get(Key::LoginUser) }} <input name="username" autocomplete="username" required></label></p>
  <p><label>{{ t.get(Key::LoginPassword) }} <input name="password" type="password" autocomplete="current-password" required></label></p>
  <button type="submit">{{ t.get(Key::LoginSubmit) }}</button>
</form>
{% endblock %}
