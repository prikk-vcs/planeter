[package]
name = "planeter-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "planeter's authentication: accounts, scoped tokens, SSH keys and deploy keys, Argon2id and constant-time hashing, behind seams."

[dependencies]
planeter-core = { path = "../planeter-core", version = "0.1.1" }
planeter-store = { path = "../planeter-store", version = "0.1.1" }

# RFC 002 T2 crypto behind the seams (STD-2), owner-approved supply-chain review 2026-09-23.
# Argon2id password hashing (PHC string format; OS-random salt via password-hash's rand_core).
argon2 = { version = "0.5", features = ["std"] }
# Token hashing: SHA-256 of a high-entropy token + constant-time comparison (no KDF needed).
sha2 = "0.10"
subtle = "2"
# OpenSSH ed25519 public-key parsing + SHA-256 fingerprints is hand-rolled (see sshkey.rs) over sha2 +
# base64ct: the `ssh-key` crate was rejected in review because it locks the unfixable RUSTSEC-2023-0071
# `rsa` crate into Cargo.lock (trips cargo-audit) for an algorithm planeter never uses.
base64ct = { version = "1", features = ["alloc"] }
# SQLite account/credential stores over planeter-store's shared SqliteDb (same crate, no new tree).
rusqlite = { version = "0.32", features = ["bundled"] }
